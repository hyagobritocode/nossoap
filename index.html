<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F0E9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <title>Nosso apê</title>
  <meta name="description" content="As compras grandes do nosso apartamento, uma de cada vez.">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/geist-latin.woff2" crossorigin>
  <link rel="preload" as="image" href="assets/rooms/sala.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="stage" aria-label="Foto do apartamento">
      <div class="stage-media">
        <img class="stage-img is-on" src="assets/rooms/sala.webp" alt="">
        <img class="stage-img" alt="">
      </div>
      <div class="stage-copy">
        <h1 class="title">Nosso apê</h1>
        <p class="stage-room" id="stage-room">Sala de estar</p>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="intro">
        <h2>Primeiro, o essencial.</h2>
        <p>Seis compras grandes para o apê funcionar. O resto a gente vê depois, com calma.</p>
      </header>

      <section class="tally" id="tally" aria-live="polite"></section>

      <section aria-label="Itens">
        <ul class="grid" id="grid" role="list"></ul>
        <button class="add-item" id="add-item" type="button">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Adicionar outro item
        </button>
      </section>

      <footer class="foot">
        Tudo fica salvo neste aparelho.
      </footer>
    </main>
  </div>

  <div class="sheet-wrap" id="sheet-wrap" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
